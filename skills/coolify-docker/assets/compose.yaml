# Adapt to the application's real environment names and health endpoint.
# APP_IMAGE must contain Node, listen on 0.0.0.0:3000 and serve GET /healthz.
# Use a verified release tag/digest, accessible from the deployment server.
# PostgreSQL 17 is deliberate: verify data paths/migrations before a major upgrade.
services:
  web:
    image: ${APP_IMAGE:?}
    environment:
      SERVICE_URL_WEB_3000: /
      PUBLIC_URL: ${SERVICE_URL_WEB_3000}
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      DATABASE_HOST: database
      DATABASE_PORT: "5432"
      DATABASE_NAME: app
      DATABASE_USER: ${SERVICE_USER_DB}
      DATABASE_PASSWORD: ${SERVICE_PASSWORD_64_DB}
    expose:
      - "3000"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "const http=require('node:http');const r=http.get({host:'127.0.0.1',port:3000,path:'/healthz'},s=>{s.resume();process.exit(s.statusCode===200?0:1)});r.setTimeout(4000,()=>r.destroy());r.on('error',()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: ${SERVICE_USER_DB}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_64_DB}
    volumes:
      - database-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  database-data:
