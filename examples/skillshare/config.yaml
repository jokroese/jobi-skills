# Copy into ~/.config/skillshare/config.yaml only if it does not exist.
# Otherwise integrate this source/selection with your existing setup.
# Replace this path with the long-lived checkout, not a task worktree.
source: /absolute/path/to/jobi-skills/skills
mode: merge
targets:
  universal:
    skills:
      path: ~/.agents/skills
      include:
        - build123d
        - git-commit
  claude:
    skills:
      path: ~/.claude/skills
      include:
        - build123d
        - git-commit
